mode = "light"

# Solstice Classic — the authentic Common Desktop Environment "Default"
# palette (cde/programs/palettes/Default.dp in cdesktopenv/cde), pixel-
# cross-checked against the SourceForge LinuxBuild wiki screenshots
# (CDE-3.png … CDE-8.png). Every chrome color below is exact.
#
# Salmon   #EDA870  active titlebar/border, selection, focus, hover (slot 1)
# Grey     #999999  inactive window borders (slot 2)
# Slate    #8998AA  workspace 1/3 buttons, secondary chrome (slot 3)
# D.Slate  #686F82  workspace 2/4 buttons, troughs, recessed (slot 4)
# Tan      #C6B2A8  window bodies, icon areas (slot 5)
# Teal     #4992A7  menubars, front panel, window chrome (slot 6)
# Rose     #B7878D  secondary accent (slot 7)
# Steel    #93ABBF  light steel blue (slot 8)
#
# Terminal templates bind to 'background', which carries the light-slate
# canvas — the CDE default desktop backdrop color. Desktop chrome stays via
# hand-pinned gtk3/gtk4.css (teal chrome on tan window bodies) and the
# wallpaper base. color0/color7 are pinned to background/foreground by the
# resolver, so the inverted light-theme ANSI (black = canvas, white = ink)
# is intentional.

# ── Structure ────────────────────────────────────────────────────────────────
accent               = "#EDA870"
selection            = "#EDA870"
selection_background = "#EDA870"
selection_foreground = "#000000"

background           = "#CAD1D9"
dark_background      = "#686F82"
darker_background    = "#4A5866"
lighter_background   = "#ADCED7"

foreground           = "#000000"
dark_foreground      = "#5B6570"
light_foreground     = "#4A545E"

# Semantic colors without a color0..color15 slot.
orange               = "#B26A28"   # battery/low indicators; not yellow
brown                = "#7D593B"

# ── Hyprland borders ───────────────────────────────────────────────────────
# CDE window frames, recalibrated for focus clarity: bright warm salmon
# marks the active window; the inactive frame uses the screenshots' dark
# teal #3E7C8D — same family as the chrome but clearly darker/cooler, so
# focus never reads as ambiguous. Bright #4992A7 teal stays on the bar
# and GTK chrome.
hyprland_active_border   = "#EDA870"
hyprland_inactive_border = "#3E7C8D"

# ── ANSI 16-color palette (canonical) ──────────────────────────────────────
# Hue-preserved recalibrations of the CDE chrome/salmon/rose/steel family,
# targeting ~5.5:1 (normals) and ~7:1 (brights) on the light-slate canvas —
# comfortably above WCAG AA, so colored terminal text reads clearly.
color0  = "#CAD1D9"   # black   (pinned to background/canvas by the resolver)
color1  = "#941E23"   # red     (CDE icon red #CC3339, recalibrated 5.5:1)
color2  = "#31543D"   # green   (sage, 5.5:1)
color3  = "#614919"   # yellow  (amber #C4983B, recalibrated 5.5:1)
color4  = "#384F63"   # blue    (steel #93ABBF, recalibrated 5.5:1)
color5  = "#6F3F45"   # magenta (CDE rose #B7878D, recalibrated 5.5:1)
color6  = "#26525F"   # cyan    (CDE dark teal #3E7C8D, recalibrated 5.5:1)
color7  = "#000000"   # white   (ink — foreground)
color8  = "#4A545E"   # br black  (muted)
color9  = "#7B1216"   # br red
color10 = "#24442F"   # br green
color11 = "#4F3A0F"   # br yellow
color12 = "#2A3F51"   # br blue
color13 = "#5D3036"   # br magenta
color14 = "#1B424D"   # br cyan
color15 = "#000000"   # br white  (bright foreground)
